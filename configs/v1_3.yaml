# Ru-Jev v1.3. Два изменения против v1.2.
#
# Первое обязательное. v1.2 обучалась без rucola и terra: хаб не отдал их один
# раз, сборщик написал [skip] и прогон пошёл дальше. На rucola она отвечает
# монеткой, 0.467 при 0.909 у v1.1, поэтому публиковать её нельзя. Сборка теперь
# повторяет загрузку и останавливается, если состав неполный.
#
# Второе по сути. Метки интентов дополнены транслитерациями английского ключа
# кириллицей и усечёнными формами. v1.2 показала, что модель обобщает форму
# метки, а не слова: обучение на фразах подняло названия служб, которых в
# обучении не было, с 0.835 до 0.894. Жаргон при этом не двинулся, 0.633 против
# 0.608, потому что перефразировки о нём ничего не говорят. Ставка в том, что
# транслитерации сработают так же. Жаргон сценариев в обучение не идёт и
# остаётся отложенным тестом.
#
# Четыре эпохи вместо трёх: у v1.2 ошибка на обучении к концу всё ещё падала.
# Чекпойнт каждой эпохи забирается отдельно, лучший выбирается замером.
base_model: jhu-clsp/mmBERT-base      # MIT, multilingual, 307M
out_dir: out/ru-jev-v1.3
max_len: 256
epochs: 4
lr: 2.0e-5
batch_examples: 16
warmup_ratio: 0.06
weight_decay: 0.01
seed: 42
include_rucola: true
val_fraction: 0.1
shuffle_options: true                  # re-order candidates every epoch
