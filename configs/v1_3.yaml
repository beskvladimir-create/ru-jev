# Ru-Jev v1.3. Two changes against v1.2.
#
# The first is a repair. v1.2 trained without rucola and terra: the hub failed to
# serve them once, the builder printed [skip] and the run continued. On rucola it
# answers at the level of a coin, 0.467 against 0.909 for v1.1, so it cannot be
# published. The build now retries the download and stops if the composition is
# incomplete.
#
# The second is the substance. The intent labels are extended with
# transliterations of the English key into Cyrillic and with clipped forms. v1.2
# showed that the model generalises the form of a label rather than its words:
# training on phrases lifted the department names, which were not in training,
# from 0.835 to 0.894. Jargon did not move, 0.633 against 0.608, because
# paraphrases say nothing about it. The bet is that transliterations will work
# the same way. Scenario jargon does not go into training and stays a held-out
# test.
#
# Four epochs instead of three: for v1.2 the training loss was still falling at
# the end. The checkpoint of every epoch is kept separately and the best one is
# chosen by measurement.
base_model: jhu-clsp/mmBERT-base      # MIT, multilingual, 307M
out_dir: out/ru-jev-v1.3
max_len: 256
epochs: 4
lr: 2.0e-5
batch_examples: 16
warmup_ratio: 0.06
weight_decay: 0.01
seed: 42
include_rucola: true
val_fraction: 0.1
shuffle_options: true                  # re-order candidates every epoch
