# Seed run 3 of the v1.3 recipe, the one with the label wordings. It differs
# from configs/v1_3.yaml in the seed field alone. The data are NOT rebuilt: the
# build that is already on disk is used, because otherwise the wording of the
# options inside the rows would change and the comparison over the six tasks
# would stop being a comparison. The released weights are seed 42 and are left
# alone.
base_model: jhu-clsp/mmBERT-base
out_dir: out/seed-aug-s3
data_dir: data
max_len: 256
epochs: 4
lr: 2.0e-5
batch_examples: 16
warmup_ratio: 0.06
weight_decay: 0.01
seed: 2024
include_rucola: true
val_fraction: 0.1
shuffle_options: true
