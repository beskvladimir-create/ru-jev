# Seed run 3 of the v1.1 recipe, the baseline without the label wordings. The
# data are the saved v1.1 build; there is nothing to rebuild it with, because the
# builder has no flag that turns the wordings off and the old builder stayed in
# commit 8724054. On the six SuperGLUE tasks these rows match the current build
# 100 percent, both in the texts and in the options.
# IMPORTANT when reporting: this is a retrained baseline, NOT the published v1.1.
base_model: jhu-clsp/mmBERT-base
out_dir: out/seed-base-s3
data_dir: ../model/data-v1.1
max_len: 256
epochs: 3
lr: 2.0e-5
batch_examples: 16
warmup_ratio: 0.06
weight_decay: 0.01
seed: 2024
include_rucola: true
val_fraction: 0.1
shuffle_options: true
