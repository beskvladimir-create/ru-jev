# Seed run 2 of the v1.3 recipe, on the mixture v1.3 actually trained on.
#
# This file is configs/v1_3.yaml with one field changed, the seed. Everything
# else is held: the same base model, the same four epochs, the same learning
# rate, the same batch, the same warmup, the same decay, the same maximum
# length, the same option shuffling, rucola included.
#
# The seed is 1337, the seed of configs/seed_aug_s2.yaml. That is deliberate.
# `seed-aug-s2` trained on a mixture built before commit 96fb67f, which is the
# mixture without the transliterated and clipped forms of the intent labels, so
# the pair "this run against seed-aug-s2" differs in the data alone at one seed,
# and the pair "this run against the released v1.3" differs in the seed alone on
# one mixture. results/seeds/FINDINGS.md holds why the earlier seed runs do not
# answer the question.
#
# The data are rebuilt with the builder as it stood at commit 96fb67f, which is
# the builder v1.3 used, and the build is held against the counts the released
# run recorded before anything is trained. The released weights are seed 42 and
# are left alone.
base_model: jhu-clsp/mmBERT-base      # MIT, multilingual, 307M
out_dir: out/v1.3-seed2
max_len: 256
epochs: 4
lr: 2.0e-5
batch_examples: 16
warmup_ratio: 0.06
weight_decay: 0.01
seed: 1337
include_rucola: true
val_fraction: 0.1
shuffle_options: true                  # re-order candidates every epoch
